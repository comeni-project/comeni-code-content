name: validate

# Every pull request to main must pass `validate` (the ruleset in .github/rulesets/main.json).
# Keep the job's name: the ruleset requires it by name.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Validate the repository
        run: uv run .github/scripts/validate.py

      # The node format, checked by Comeni Code's validator at a pinned commit. Moving the pin is a
      # pull request of its own, so this repository's CI proves the content passes the newer rules.
      - name: Validate nodes
        run: >
          uvx --from "git+https://github.com/comeni-project/Comeni-Code@559cbf4ff5fc7f27998c2ee2a6bfdf2796652b84#subdirectory=packages/code-schema"
          code-schema validate . --format github
